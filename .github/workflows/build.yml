name: BSM DAW Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build BSM DAW
        run: cmake --build build --config Release --parallel

      - name: Verify application bundle
        run: |
          test -d "build/BSM_DAW_artefacts/Release/BSM DAW.app"
          test -d "build/BSM_DAW_artefacts/Release/BSM DAW.app/Contents/MacOS"
          test -f "build/BSM_DAW_artefacts/Release/BSM DAW.app/Contents/MacOS/BSM DAW"

      - name: Package macOS application
        run: |
          rm -rf dist
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            "build/BSM_DAW_artefacts/Release/BSM DAW.app" \
            "dist/BSM-DAW-macOS.zip"
          hdiutil create \
            -volname "BSM DAW" \
            -srcfolder "build/BSM_DAW_artefacts/Release/BSM DAW.app" \
            -ov \
            -format UDZO \
            "dist/BSM-DAW-macOS.dmg"
          unzip -l "dist/BSM-DAW-macOS.zip"
          hdiutil imageinfo "dist/BSM-DAW-macOS.dmg"

      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: BSM-DAW-macOS-Installer
          path: dist/*
          if-no-files-found: error
