name: BSM DAW Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build BSM DAW
        run: cmake --build build --config Release --parallel

      - name: Verify application bundle
        run: test -d "build/BSM_DAW_artefacts/Release/BSM DAW.app"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BSM-DAW-macOS
          path: build/BSM_DAW_artefacts/Release/BSM DAW.app
          if-no-files-found: error
