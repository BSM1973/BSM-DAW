name: Liberty Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS Universal
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"

      - name: Build Liberty
        run: cmake --build build --config Release --parallel

      - name: Verify application bundle
        run: |
          APP="build/BSM_DAW_artefacts/Release/Liberty.app"
          test -d "$APP"
          test -d "$APP/Contents/MacOS"
          test -f "$APP/Contents/MacOS/Liberty"

      - name: Sign application for local macOS execution
        run: |
          APP="build/BSM_DAW_artefacts/Release/Liberty.app"
          xattr -cr "$APP"
          codesign --force --deep --verbose --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          file "$APP/Contents/MacOS/Liberty"
          lipo -info "$APP/Contents/MacOS/Liberty"

      - name: Package macOS application
        run: |
          APP="build/BSM_DAW_artefacts/Release/Liberty.app"
          rm -rf dist
          mkdir -p dist

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP" \
            "dist/Liberty-macOS.zip"

          hdiutil create \
            -volname "Liberty" \
            -srcfolder "$APP" \
            -ov \
            -format UDZO \
            "dist/Liberty-macOS.dmg"

          unzip -l "dist/Liberty-macOS.zip"
          hdiutil imageinfo "dist/Liberty-macOS.dmg"

      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: Liberty-macOS-Universal-Installer
          path: dist/*
          if-no-files-found: error
