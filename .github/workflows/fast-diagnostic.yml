name: Liberty Fast Diagnostic
# queue refresh 2026-09-25
# queue refresh
# queue refresh 2

# One diagnostic per update to the active development branch.
# Previously push + pull_request scheduled duplicate macOS jobs for the same SHA.
# Keep manual runs available; the separate build.yml handles pushes to main.
on:
  push:
    branches: [ 'fix/midi-timeline-instrument-audio-32aa5ab', 'feature/step-sequencer-polyphonic-phase1', 'feature/step-sequencer-ui-phase2', 'feature/step-sequencer-edit-phase3', 'feature/step-sequencer-midi-phase4', 'feature/step-sequencer-validation-phase5', 'feature/step-sequencer-direct-note-edit', 'feature/step-seq-preview-arrangement-pages-french', 'feature/dock-mixer-db-graduations', 'feature/perform-session-phase1', 'feature/perform-clip-inspector-phase2', 'feature/perform-midi-editor-phase3', 'feature/perform-transform-generate-phase4', 'feature/perform-live-pro-phase5', 'fix/performance-live-ui-cleanup', 'feature/liberty-ui-modern-refresh', 'feature/liberty-obsidian-signature', 'feature/liberty-obsidian-studio', 'feature/liberty-obsidian-motion', 'feature/liberty-obsidian-precision', 'feature/liberty-obsidian-immersive', 'feature/liberty-obsidian-mastering', 'feature/liberty-obsidian-mastering-pro', 'feature/liberty-obsidian-reference-studio', 'feature/liberty-obsidian-final-control', 'feature/liberty-drum-sampler-studio', 'feature/liberty-drum-pad-icons', 'feature/liberty-drum-midi-learn-sound', 'feature/liberty-daw-three-editions' ]
  workflow_dispatch:

jobs:
  # Independent, fast console regressions. They run even if GitHub cannot
  # allocate a hosted macOS ARM64 machine for the complete application.
  mixer-unit-regressions:
    name: MIXER C++ regressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate three planned editions and reject unimplemented native devices
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -UNDEBUG -I Source Tests/LibertyEditionCatalogSmoke.cpp -o /tmp/liberty-editions-catalog
          /tmp/liberty-editions-catalog
          grep -F 'Liberty ${LIBERTY_DAW_EDITION} is not releasable yet' CMakeLists.txt

      - name: Verify deferred UI startup lifecycle
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG -I Source Tests/LibertyDeferredUiSmoke.cpp -o /tmp/liberty-ui-lifecycle
          /tmp/liberty-ui-lifecycle

      - name: Verify offline multicore job ownership
        run: |
          c++ -std=c++17 -pthread -Wall -Wextra -Werror -UNDEBUG -I Source Tests/LibertyOfflinePoolSmoke.cpp -o /tmp/liberty-offline-pool
          /tmp/liberty-offline-pool

      - name: Verify realtime dependency ledger and latency planning
        run: |
          c++ -std=c++17 -pthread -Wall -Wextra -Werror -UNDEBUG -I Source Tests/LibertyRealtimePlanSmoke.cpp -o /tmp/liberty-realtime-plan
          /tmp/liberty-realtime-plan

      - name: Verify preallocated PDC delay lines
        run: |
          c++ -std=c++17 -pthread -Wall -Wextra -Werror -UNDEBUG -I Source Tests/LibertyDelayCompensationSmoke.cpp -o /tmp/liberty-pdc
          /tmp/liberty-pdc

      - name: CPU meter arithmetic regression
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG -I Source Tests/LibertyCpuMeterSmoke.cpp -o /tmp/liberty-cpu-meter
          /tmp/liberty-cpu-meter

      - name: Sample Lab analysis regression
        run: |
          c++ -O2 -std=c++17 -Wall -Wextra -Werror -I Source Tests/LibertySampleAnalysisSmoke.cpp -o /tmp/liberty-sample-lab
          /tmp/liberty-sample-lab

      - name: Reject corrupted French UI text (UTF-8)
        run: python3 Tests/FrenchTextRegression.py

      - name: Guard ARRANGEMENT playhead from leaking into PERFORMANCE
        run: python3 Tests/PerformPlayheadOverlayRegression.py

      - name: Test PERFORMANCE session timing and MIDI integration
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG -I Source Tests/PerformSessionTimingSmoke.cpp -o /tmp/liberty-perform-session
          /tmp/liberty-perform-session
          python3 Tests/PerformSessionSourceRegression.py
          c++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG -I Source Tests/PerformClipSettingsSmoke.cpp -o /tmp/liberty-clip-inspector
          /tmp/liberty-clip-inspector
          python3 Tests/PerformClipInspectorSourceRegression.py
          c++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG -I Source Tests/PerformMidiEditorOpsSmoke.cpp -o /tmp/liberty-midi-editor
          /tmp/liberty-midi-editor
          python3 Tests/PerformMidiEditorSourceRegression.py
          c++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG -I Source Tests/PerformMidiGeneratorSmoke.cpp -o /tmp/liberty-perform-generator
          /tmp/liberty-perform-generator
          python3 Tests/PerformMidiGeneratorSourceRegression.py
          c++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG -I Source Tests/PerformLiveProSmoke.cpp -o /tmp/liberty-perform-live
          /tmp/liberty-perform-live
          python3 Tests/PerformLiveProSourceRegression.py
          python3 Tests/PerformLiveUiCleanupSourceRegression.py
          python3 Tests/LibertyModernUiSourceRegression.py
          c++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG -I Source Tests/LibertyDrumPatterns100Smoke.cpp -o /tmp/liberty-100-drums
          /tmp/liberty-100-drums
          c++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG -I Source Tests/LibertyMotionSmoke.cpp -o /tmp/liberty-motion
          /tmp/liberty-motion
          c++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG -I Source Tests/LibertyImmersiveSmoke.cpp -o /tmp/liberty-immersive
          /tmp/liberty-immersive
          c++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG -I Source Tests/LibertyMasteringSmoke.cpp -o /tmp/liberty-mastering
          /tmp/liberty-mastering
          c++ -O2 -std=c++17 -Wall -Wextra -Werror -UNDEBUG -I Source Tests/LibertyReferenceSmoke.cpp -o /tmp/liberty-reference
          /tmp/liberty-reference
          c++ -O3 -std=c++17 -Wall -Wextra -Werror -UNDEBUG -I Source Tests/LibertyFinalControl.cpp -o /tmp/liberty-final-control
          /tmp/liberty-final-control /tmp/liberty-final-report.pdf

      - name: Validate final-control PDF using an independent reader
        run: |
          command -v pdfinfo >/dev/null || (sudo apt-get update && sudo apt-get install -y poppler-utils)
          pdfinfo /tmp/liberty-final-report.pdf | grep -E 'Pages:[[:space:]]+2$'
          pdftotext /tmp/liberty-final-report.pdf /tmp/liberty-final-report.txt
          grep -F 'Synthèse (A) et référence B' /tmp/liberty-final-report.txt
          grep -F 'Repere 60' /tmp/liberty-final-report.txt

      - name: Verify plugin collections XML parser, size limits and import rollback
        run: python3 Tests/PluginCollectionsXmlRegression.py

      - name: Verify polyphonic Step Sequencer notes and per-note lengths
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG -I Source Tests/PolyphonicStepGridSmoke.cpp -o /tmp/liberty-polyphonic-grid
          /tmp/liberty-polyphonic-grid
          python3 Tests/PolyphonicStepGridSourceRegression.py
          c++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG -I Source Tests/PolyphonicStepGridLayoutSmoke.cpp -o /tmp/liberty-polyphonic-layout
          /tmp/liberty-polyphonic-layout
          python3 Tests/PolyphonicStepGridUIRegression.py
          c++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG -I Source Tests/PolyphonicStepGridEditingSmoke.cpp -o /tmp/liberty-polyphonic-editor
          /tmp/liberty-polyphonic-editor
          python3 Tests/PolyphonicStepGridEditingSourceRegression.py
          c++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG -I Source Tests/PolyphonicStepGridMidiBridgeSmoke.cpp -o /tmp/liberty-step-midi-bridge
          /tmp/liberty-step-midi-bridge
          python3 Tests/PolyphonicStepGridMidiIntegrationRegression.py
          c++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG -I Source Tests/PolyphonicStepGridProfessionalSmoke.cpp -o /tmp/liberty-step-professional
          /tmp/liberty-step-professional
          python3 Tests/PolyphonicStepGridProfessionalSourceRegression.py
          c++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG -I Source Tests/PolyphonicStepGridDirectEditSmoke.cpp -o /tmp/liberty-step-direct-note
          /tmp/liberty-step-direct-note
          python3 Tests/PolyphonicStepGridDirectEditSourceRegression.py
          c++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG -I Source Tests/PolyphonicStepGridPagesSmoke.cpp -o /tmp/liberty-step-pages
          /tmp/liberty-step-pages
          python3 Tests/PolyphonicStepGridPreviewSourceRegression.py
          c++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG -I Source Tests/DockMixerDbScaleSmoke.cpp -o /tmp/liberty-dock-mixer-db
          /tmp/liberty-dock-mixer-db
          python3 Tests/DockMixerDbScaleSourceRegression.py

      - name: Verify Splice scan routes to sample library, never full plugin inventory
        run: python3 Tests/SpliceScanRoutingRegression.py

      - name: Verify global UI no-overlap zones and routing panel
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG Tests/NoOverlapLayoutRegression.cpp -o /tmp/liberty-no-overlap
          /tmp/liberty-no-overlap

      - name: Verify progressively revealed FX slots
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG Tests/MixerProgressiveFxRegression.cpp -o /tmp/liberty-progressive-fx
          /tmp/liberty-progressive-fx

      - name: Verify mixer layout and pinned faders
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG Tests/MixConsoleLayoutRegression.cpp -o /tmp/liberty-mixer-layout
          /tmp/liberty-mixer-layout
      - name: Verify saved bus routes and Master fallback
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG Tests/MixerBusRoutingRegression.cpp -o /tmp/liberty-bus-routing
          /tmp/liberty-bus-routing

      - name: Verify normal and exclusive Solo across audio and instrument tracks
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG Tests/MixConsoleSoloRegression.cpp -o /tmp/liberty-mixer-solo
          /tmp/liberty-mixer-solo
      - name: Verify real-time meter, peak hold and reset on Linux
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG Tests/MixConsoleMeterRegression.cpp -o /tmp/liberty-mixer-meter
          /tmp/liberty-mixer-meter

  mastering-ebu-reference:
    name: Mastering PRO - EBU stereo reference subset
    if: github.ref == 'refs/heads/feature/liberty-obsidian-mastering-pro' || github.ref == 'refs/heads/feature/liberty-obsidian-final-control'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Compile offline reference meter
        run: c++ -O3 -std=c++17 -Wall -Wextra -Werror -I Source Tests/LibertyMasteringReference.cpp -o /tmp/liberty-ebu-meter
      - name: Measure official EBU sequences (separate non-certification report)
        run: |
          set -o pipefail
          mkdir -p ebu-report
          if ! curl --fail --location --retry 2 --max-time 150 --user-agent 'Mozilla/5.0' --referer 'https://tech.ebu.ch/publications/ebu_loudness_test_set' 'https://tech.ebu.ch/files/live/sites/tech/files/shared/testmaterial/ebu-loudness-test-setv05.zip' -o /tmp/ebu-test.zip; then
            echo 'NOT RUN: official EBU archive unavailable' | tee ebu-report/results.txt
            exit 1
          fi
          python3 Tests/LibertyMasteringEbu.py /tmp/ebu-test.zip /tmp/liberty-ebu-meter | tee ebu-report/results.txt
      - name: Upload EBU measurement report only (no reference audio)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Liberty-Mastering-EBU-Report
          path: ebu-report/results.txt
          if-no-files-found: warn

  fast-macos-arm64:
    name: Fast macOS arm64 (macOS 26)
    # GitHub cancelled two macos-15 attempts with zero steps and no runner.
    # macos-26 is an official Apple Silicon/arm64 standard hosted label.
    runs-on: macos-26
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: brew install ninja ccache

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: liberty-ccache-arm64-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            liberty-ccache-arm64-${{ runner.os }}-

      - name: Verify macOS packaging and notarization scripts syntax
        run: |
          bash -n Scripts/create-macos-dmg.sh
          bash -n Scripts/sign-macos-release.sh
          bash -n Scripts/notarize-macos-dmg.sh
          plutil -lint Scripts/Liberty-DAW.entitlements

      - name: Validate Riche WAV analyzer
        run: python3 Tests/RicheAudioValidation.py --self-test

      - name: Guard validated track header controls
        run: python3 Tests/TrackHeaderRegression.py

      - name: Reject corrupted French UI text before macOS build
        run: python3 Tests/FrenchTextRegression.py

      - name: Guard ARRANGEMENT playhead from leaking into PERFORMANCE
        run: python3 Tests/PerformPlayheadOverlayRegression.py

      - name: Test PERFORMANCE session timing and MIDI integration
        run: |
          clang++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG -I Source Tests/PerformSessionTimingSmoke.cpp -o /tmp/liberty-perform-session
          /tmp/liberty-perform-session
          python3 Tests/PerformSessionSourceRegression.py
          clang++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG -I Source Tests/PerformClipSettingsSmoke.cpp -o /tmp/liberty-clip-inspector
          /tmp/liberty-clip-inspector
          python3 Tests/PerformClipInspectorSourceRegression.py
          clang++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG -I Source Tests/PerformMidiEditorOpsSmoke.cpp -o /tmp/liberty-midi-editor
          /tmp/liberty-midi-editor
          python3 Tests/PerformMidiEditorSourceRegression.py
          clang++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG -I Source Tests/PerformMidiGeneratorSmoke.cpp -o /tmp/liberty-perform-generator
          /tmp/liberty-perform-generator
          python3 Tests/PerformMidiGeneratorSourceRegression.py
          clang++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG -I Source Tests/PerformLiveProSmoke.cpp -o /tmp/liberty-perform-live
          /tmp/liberty-perform-live
          python3 Tests/PerformLiveProSourceRegression.py
          python3 Tests/PerformLiveUiCleanupSourceRegression.py
          python3 Tests/LibertyModernUiSourceRegression.py
          clang++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG -I Source Tests/LibertyMotionSmoke.cpp -o /tmp/liberty-motion
          /tmp/liberty-motion
          c++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG -I Source Tests/LibertyImmersiveSmoke.cpp -o /tmp/liberty-immersive
          /tmp/liberty-immersive
          c++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG -I Source Tests/LibertyMasteringSmoke.cpp -o /tmp/liberty-mastering
          /tmp/liberty-mastering
          c++ -O2 -std=c++17 -Wall -Wextra -Werror -UNDEBUG -I Source Tests/LibertyReferenceSmoke.cpp -o /tmp/liberty-reference
          /tmp/liberty-reference
          c++ -O3 -std=c++17 -Wall -Wextra -Werror -UNDEBUG -I Source Tests/LibertyFinalControl.cpp -o /tmp/liberty-final-control
          /tmp/liberty-final-control /tmp/liberty-final-report.pdf

      - name: Verify strict non-overlapping global UI regions
        run: |
          clang++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG Tests/NoOverlapLayoutRegression.cpp -o /tmp/liberty-no-overlap
          /tmp/liberty-no-overlap

      - name: Verify progressive FX and no-overlap geometry on macOS
        run: |
          clang++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG Tests/MixerProgressiveFxRegression.cpp -o /tmp/liberty-progressive-fx
          /tmp/liberty-progressive-fx

      - name: Verify independent mixer panels and pinned faders
        run: |
          clang++ -std=c++17 -Wall -Wextra -Werror Tests/MixConsoleLayoutRegression.cpp -o /tmp/liberty-mixer-layout
          /tmp/liberty-mixer-layout

      - name: Verify mixer Solo exclusive and all-clear controls
        run: |
          clang++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG Tests/MixConsoleSoloRegression.cpp -o /tmp/liberty-mixer-solo
          /tmp/liberty-mixer-solo

      - name: Verify real-time mixer sample peaks, held peaks and CLIP reset
        run: |
          clang++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG Tests/MixConsoleMeterRegression.cpp -o /tmp/liberty-mixer-meter
          /tmp/liberty-mixer-meter

      - name: Verify channel inspector controls never overlap
        run: |
          clang++ -std=c++17 -Wall -Wextra -Werror Tests/ChannelDialogLayoutRegression.cpp -o /tmp/liberty-channel-dialog-layout
          /tmp/liberty-channel-dialog-layout

      - name: Verify isolated CANAL A/B parameter copying
        run: |
          clang++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG Tests/ChannelParameterTransferRegression.cpp -o /tmp/liberty-canal-parameter-copy
          /tmp/liberty-canal-parameter-copy

      - name: Verify CANAL A/B undo and redo history
        run: |
          clang++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG Tests/ChannelABHistoryRegression.cpp -o /tmp/liberty-canal-ab-history
          /tmp/liberty-canal-ab-history

      - name: Verify CANAL A/B shortcut routing and numeric text protection
        run: |
          clang++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG Tests/ChannelABShortcutRegression.cpp -o /tmp/liberty-canal-ab-shortcuts
          /tmp/liberty-canal-ab-shortcuts

      - name: Verify CANAL A/B per-knob Undo grouping
        run: |
          clang++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG Tests/ChannelABGestureHistoryRegression.cpp -o /tmp/liberty-canal-gesture-history
          /tmp/liberty-canal-gesture-history

      - name: Verify CANAL A/B global overview counts and menu routing
        run: |
          clang++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG Tests/ChannelABOverviewRegression.cpp -o /tmp/liberty-canal-ab-overview
          /tmp/liberty-canal-ab-overview

      - name: Configure CMake arm64
        run: |
          rm -rf build-fast
          cmake -S . -B build-fast -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIBERTY_NATIVE_PREVIEW=${{ github.ref == 'refs/heads/feature/liberty-daw-three-editions' && 'ON' || 'OFF' }} \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          ccache --zero-stats

      - name: Build Liberty fast
        env:
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: "true"
          CCACHE_COMPRESS: "true"
          CCACHE_MAXSIZE: "2G"
        run: |
          cmake --build build-fast --parallel $(sysctl -n hw.ncpu)
          ccache --show-stats

      - name: Validate original FreeSpirit DSP and native insert roundtrip
        if: github.ref == 'refs/heads/feature/liberty-daw-three-editions'
        run: ctest --test-dir build-fast --output-on-failure -R 'LibertyNativeFreeSpiritSmoke|LibertyFreeSpiritOriginalCoreTests'

      - name: Test audio clip playback and fade preservation (5 independent launches)
        shell: bash
        run: |
          # The #2963 run crashed intermittently with SIGSEGV during this test.
          # Run fresh processes to expose lifetime/race defects; NEVER retry
          # a failed attempt and NEVER hide its original nonzero exit status.
          app="build-fast/BSM_DAW_artefacts/Release/Liberty.app/Contents/MacOS/Liberty"
          for attempt in 1 2 3 4 5; do
            echo "Audio clip playback smoke - independent launch ${attempt}/5"
            if "$app" --audio-clip-playback-test; then
              echo "Audio clip playback smoke - launch ${attempt}/5 OK"
            else
              exit_code=$?
              echo "::error::Audio playback smoke failed on launch ${attempt}/5 (exit ${exit_code})"
              echo "::group::macOS Liberty crash reports"
              sleep 2
              for ext in ips crash; do
                find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f -name "Liberty*.${ext}" -mmin -15 -print -exec head -n 140 {} \; 2>/dev/null || true
              done
              echo "::endgroup::"
              exit "$exit_code"
            fi
          done

      - name: Benchmark real audio callback (macOS)
        run: |
          status=0
          ctest --test-dir build-fast -V --output-on-failure -R '^LibertyCpuPerformanceSmoke$' || status=$?
          if [ -f build-fast/liberty-cpu-benchmark-trace.txt ]; then
            cat build-fast/liberty-cpu-benchmark-trace.txt
          fi
          exit "$status"

      - name: Test CANAL settings, neutral project reset and project XML roundtrip
        run: build-fast/BSM_DAW_artefacts/Release/Liberty.app/Contents/MacOS/Liberty --channel-processing-test

      - name: Test arrangement clip edits and fade Undo/Redo
        run: build-fast/BSM_DAW_artefacts/Release/Liberty.app/Contents/MacOS/Liberty --arrangement-tools-test

      - name: Run Drum Sampler regression tests
        run: ctest --test-dir build-fast --output-on-failure -R 'DrumSamplerSmoke|PolyphonicGridSmoke|PolyphonicGridLayoutSmoke|PolyphonicGridEditingSmoke|PolyphonicGridMidiBridgeSmoke|PolyphonicGridProfessionalSmoke|PolyphonicGridDirectEditSmoke|PolyphonicGridPagesSmoke|DockMixerDbScaleSmoke|LibertyRealtimePlanSmoke|LibertyDelayCompensationSmoke'

      - name: Test real Step Sequencer project XML roundtrip (3 fresh launches)
        shell: bash
        run: |
          app="build-fast/BSM_DAW_artefacts/Release/Liberty.app/Contents/MacOS/Liberty"
          for attempt in 1 2 3; do
            echo "Step Sequencer project roundtrip launch ${attempt}/3"
            if "$app" --step-sequencer-phase5-test; then
              continue
            else
              code=$?
              echo "::error::Step Sequencer roundtrip failed on launch ${attempt}, exit ${code}"
              mkdir -p build-fast/riche-fixtures
              # Preserve the failure and collect a native backtrace on a fresh launch.
              lldb --batch -o run -o "thread backtrace all" -- "$app" --step-sequencer-phase5-test > build-fast/riche-fixtures/step-sequencer-crash.txt 2>&1 || true
              exit "$code"
            fi
          done

      - name: Measure spectral track edit latency (5 fresh launches)
        run: |
          python3 Tests/GenerateRicheFixtures.py build-fast/riche-fixtures
          python3 - <<'PY'
          import json
          from pathlib import Path
          import re
          import subprocess
          import sys

          app = "build-fast/BSM_DAW_artefacts/Release/Liberty.app/Contents/MacOS/Liberty"
          sample = "build-fast/riche-fixtures/guitar.wav"
          pattern = re.compile(
              r"SPECTRAL_TRACK_LATENCY add_p95_ms=([0-9.]+) "
              r"add_max_ms=([0-9.]+) remove_p95_ms=([0-9.]+) "
              r"remove_max_ms=([0-9.]+) operations=120 fft_starts=([0-9]+) "
              r"add_lock_max_ms=([0-9.]+) remove_lock_max_ms=([0-9.]+)")
          records = []
          for attempt in range(1, 6):
              print(f"Spectral track latency test {attempt}/5", flush=True)
              try:
                  result = subprocess.run(
                      [app, "--spectral-track-lifetime-test", sample],
                      timeout=90, check=False, capture_output=True, text=True)
              except subprocess.TimeoutExpired:
                  print(f"::error::Spectral lifetime test timed out on launch {attempt}", flush=True)
                  sys.exit(124)
              if result.returncode != 0:
                  print(result.stdout, result.stderr, flush=True)
                  print(f"::error::Spectral lifetime test failed on launch {attempt}: "
                        f"exit={result.returncode}", flush=True)
                  sys.exit(1)
              match = pattern.search(result.stdout)
              if match is None:
                  print(result.stdout, result.stderr, flush=True)
                  print(f"::error::Missing spectral latency metrics on launch {attempt}", flush=True)
                  sys.exit(1)
              fft_starts = int(match[5])
              # Four persistent spectral tracks are invalidated together
              # during editing; all must resume spectral rendering.
              if fft_starts < 4:
                  print(f"::error::Insufficient multi-track FFT activity on launch {attempt}: "
                        f"{fft_starts} starts, expected at least 4", flush=True)
                  sys.exit(1)
              record = dict(attempt=attempt,
                            add_p95_ms=float(match[1]), add_max_ms=float(match[2]),
                            remove_p95_ms=float(match[3]), remove_max_ms=float(match[4]),
                            fft_starts=fft_starts,
                            add_lock_max_ms=float(match[6]),
                            remove_lock_max_ms=float(match[7]))
              records.append(record)
              print("  " + json.dumps(record), flush=True)
          output = Path("build-fast/riche-fixtures/spectral-track-latency.json")
          output.write_text(json.dumps(records, indent=2) + "\n")
          print(f"Spectral 5/5 passed; worst add={max(r['add_max_ms'] for r in records):.3f} ms; "
                f"worst remove={max(r['remove_max_ms'] for r in records):.3f} ms", flush=True)
          PY

      - name: Render and measure real Riche engine fixtures
        run: |
          python3 Tests/GenerateRicheFixtures.py build-fast/riche-fixtures
          APP="build-fast/BSM_DAW_artefacts/Release/Liberty.app/Contents/MacOS/Liberty"
          for kind in drums voice guitar; do
            for ratio in 0.75 1.5; do
              for block in 64 256 1024; do
                input="build-fast/riche-fixtures/${kind}.wav"
                output="build-fast/riche-fixtures/${kind}-${ratio}-${block}.wav"
                echo "RICHE case: kind=$kind ratio=$ratio block=$block"
                # Keep the diagnostic bounded: a crashed audio renderer must not
                # trigger an unbounded LLDB replay on a hosted macOS runner.
                # Python propagates the signal as a non-zero exit status.
                if python3 - "$APP" "$input" "$output" "$ratio" "$block" <<'PY'
          import subprocess
          import sys
          app, source, destination, ratio, block = sys.argv[1:]
          try:
              result = subprocess.run(
                  [app, "--render-riche-test", source, destination, ratio, block],
                  timeout=60, check=False)
          except subprocess.TimeoutExpired:
              print(f"::error::RICHE renderer timed out: ratio={ratio} block={block}", flush=True)
              sys.exit(124)
          if result.returncode != 0:
              print(f"::error::RICHE renderer failed: ratio={ratio} block={block} exit={result.returncode}", flush=True)
              sys.exit(1)
          PY
                then
                  echo "RICHE render OK: $kind $ratio $block"
                else
                  echo "::error::RICHE failed: kind=$kind ratio=$ratio block=$block"
                  exit 1
                fi
                python3 Tests/RicheAudioValidation.py --reference "$input" --render "$output" --ratio "$ratio" --boundary "$block" --json "build-fast/riche-fixtures/${kind}-${ratio}-${block}.json" > /dev/null
              done
            done
          done

      - name: Stress-test RICHE guitar short blocks in fresh processes (12 launches)
        run: |
          # Exercise the exact intermittent SIGSEGV scenario using fresh
          # application processes. Every run must pass; never retry failures.
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          app = Path("build-fast/BSM_DAW_artefacts/Release/Liberty.app/Contents/MacOS/Liberty")
          source = Path("build-fast/riche-fixtures/guitar.wav")
          output_dir = Path("build-fast/riche-fixtures/stress")
          output_dir.mkdir(parents=True, exist_ok=True)
          if not app.is_file() or not source.is_file():
              print("::error::RICHE stress setup missing binary or guitar fixture", flush=True)
              sys.exit(1)
          for attempt in range(1, 13):
              output = output_dir / f"guitar-075-64-{attempt:02d}.wav"
              print(f"RICHE fresh-process guitar 0.75 / 64: launch {attempt}/12", flush=True)
              try:
                  result = subprocess.run(
                      [str(app), "--render-riche-test", str(source),
                       str(output), "0.75", "64"],
                      timeout=60, check=False)
              except subprocess.TimeoutExpired:
                  print(f"::error::RICHE guitar stress timed out on launch {attempt}", flush=True)
                  sys.exit(124)
              if result.returncode != 0 or not output.is_file() or output.stat().st_size < 44:
                  print(f"::error::RICHE guitar stress failed on launch {attempt}: "
                        f"exit={result.returncode}", flush=True)
                  sys.exit(1)
          print("RICHE guitar short-block stress: 12/12 launches passed", flush=True)
          PY

      - name: Archive Riche WAV diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Liberty-Riche-Audio-Diagnostics
          path: |
            build-fast/riche-fixtures/*.json
            build-fast/riche-fixtures/*.wav
          if-no-files-found: warn
          retention-days: 14

      - name: Verify application bundle
        run: |
          APP="build-fast/BSM_DAW_artefacts/Release/Liberty.app"
          test -d "$APP"
          test -f "$APP/Contents/MacOS/Liberty"
          file "$APP/Contents/MacOS/Liberty"

      - name: Sign application for local macOS execution
        run: |
          APP="build-fast/BSM_DAW_artefacts/Release/Liberty.app"
          xattr -cr "$APP"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Package fast diagnostic app
        run: |
          APP="build-fast/BSM_DAW_artefacts/Release/Liberty.app"
          rm -rf dist-fast
          mkdir -p dist-fast
          if [[ "$GITHUB_REF" == "refs/heads/feature/liberty-daw-three-editions" ]]; then
            PREVIEW_APP="$(dirname "$APP")/Liberty Native Preview.app"
            mv "$APP" "$PREVIEW_APP"
            APP="$PREVIEW_APP"
            echo "Internal FreeSpirit preview; not Base, Standard or Ultimate retail." > dist-fast/PREVIEW-STATUS.txt
          fi
          echo "LIBERTY_PACKAGE_APP=$APP" >> "$GITHUB_ENV"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist-fast/Liberty-macOS-arm64-Diagnostic.zip"

      - name: Upload diagnostic app
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref == 'refs/heads/feature/liberty-daw-three-editions' && 'Liberty-Native-FreeSpirit-Preview-arm64-ZIP' || 'Liberty-macOS-arm64-Diagnostic' }}
          path: |
            dist-fast/Liberty-macOS-arm64-Diagnostic.zip
            dist-fast/PREVIEW-STATUS.txt
          if-no-files-found: error
          retention-days: 7

      - name: Package and verify Liberty DMG installer
        run: |
          bash Scripts/create-macos-dmg.sh \
            "$LIBERTY_PACKAGE_APP" \
            "dist-fast/Liberty-macOS-arm64.dmg"

      - name: Generate and verify Liberty DMG SHA-256 checksum
        run: |
          cd dist-fast
          shasum -a 256 Liberty-macOS-arm64.dmg > Liberty-macOS-arm64.dmg.sha256
          shasum -a 256 -c Liberty-macOS-arm64.dmg.sha256

      - name: Upload Liberty DMG installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref == 'refs/heads/feature/liberty-daw-three-editions' && 'Liberty-Native-FreeSpirit-Preview-arm64-DMG' || 'Liberty-macOS-arm64-DMG' }}
          path: |
            dist-fast/Liberty-macOS-arm64.dmg
            dist-fast/Liberty-macOS-arm64.dmg.sha256
          if-no-files-found: error
          retention-days: 14

  windows-native-validation:
    name: Browser PRO Windows x64 native validation
    if: github.ref == 'refs/heads/feature/liberty-daw-three-editions'
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify UTF-8 source text
        run: python Tests/FrenchTextRegression.py
      - name: Configure MSVC x64 native preview
        run: cmake -S . -B build-win -G "Visual Studio 17 2022" -A x64 -DLIBERTY_NATIVE_PREVIEW=ON
      - name: Compile application and regression executables
        run: cmake --build build-win --config Release --parallel 2
      - name: Run native DSP and browser regressions
        run: ctest --test-dir build-win -C Release --output-on-failure -V -R "LibertyNativeFreeSpiritSmoke|LibertyFreeSpiritOriginalCoreTests|LibertyEditionCatalogSmoke|DrumSamplerSmoke|PolyphonicGridSmoke|PolyphonicGridLayoutSmoke|PolyphonicGridEditingSmoke|PolyphonicGridMidiBridgeSmoke|PolyphonicGridProfessionalSmoke|PolyphonicGridDirectEditSmoke|PolyphonicGridPagesSmoke|DockMixerDbScaleSmoke|LibertyRealtimePlanSmoke|LibertyDelayCompensationSmoke"
      - name: Benchmark real audio callback (Windows)
        id: cpu-benchmark-win
        shell: pwsh
        run: |
          ctest --test-dir build-win -C Release -V --output-on-failure -R "^LibertyCpuPerformanceSmoke$"
          $code = $LASTEXITCODE
          if (Test-Path 'build-win/liberty-cpu-benchmark-trace.txt') {
            Get-Content 'build-win/liberty-cpu-benchmark-trace.txt'
          } else { Write-Host 'No benchmark trace: failure may precede test entry.' }
          exit $code
      - name: Capture Windows crash stack (diagnostic only)
        if: failure() && steps.cpu-benchmark-win.outcome == 'failure'
        shell: pwsh
        run: |
          $app = (Resolve-Path 'build-win/BSM_DAW_artefacts/Release/Liberty.exe').Path
          $symbols = (Resolve-Path 'build-win/symbols').Path
          $debugger = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Debuggers\x64\cdb.exe'
          if (-not (Test-Path $debugger)) {
            $found = Get-Command cdb.exe -ErrorAction SilentlyContinue
            if ($found) { $debugger = $found.Source }
          }
          if (Test-Path $debugger) {
            $log = Join-Path (Get-Location) 'build-win\cpu-crash-stack.txt'
            # Preserve the original failed test; this replay is for stack diagnosis only.
            & $debugger -logo $log -y "$symbols;$(Split-Path $app)" -c 'sxd av; g; .lastevent; .ecxr; kv; lm; q' $app --cpu-performance-test
            if (Test-Path $log) { Get-Content $log }
          } else {
            Write-Warning 'Windows SDK debugger unavailable; reading application crash events.'
          }
          Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-15)} -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'Liberty.exe' } | Select-Object -First 5 | Format-List TimeCreated,Id,Message
      - name: Upload Windows CPU crash evidence
        if: failure() && steps.cpu-benchmark-win.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: Liberty-Windows-CPU-Crash-Diagnostics
          path: |
            build-win/liberty-cpu-benchmark-trace.txt
            build-win/cpu-crash-stack.txt
          if-no-files-found: warn
      - name: Verify preview executable
        shell: pwsh
        run: |
          $app = Get-Item 'build-win/BSM_DAW_artefacts/Release/Liberty.exe' -ErrorAction Stop
          if ($app.Length -le 0) { throw 'Empty executable' }
      - name: Upload Windows x64 development preview
        uses: actions/upload-artifact@v4
        with:
          name: Liberty-Native-FreeSpirit-Preview-windows-x64-ZIP
          path: build-win/BSM_DAW_artefacts/Release/
          if-no-files-found: error
